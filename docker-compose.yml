version: "3.7"

services:
  user_service:
    build:
      context: ./services/user
      dockerfile: Dockerfile
    command: uvicorn app.asgi:application --host 0.0.0.0 --port 8000 --reload --log-level info
    volumes:
      - ./app:/usr/src/service/app
      - ./core:/usr/src/service/core
      - ./services/user/apis:/usr/src/service/apis
      - ./services/user/.env:/usr/src/service/.env
      - static_volume:/usr/src/service/static
      - media_volume:/usr/src/service/media
      - ./services/user/pyproject.toml:/usr/src/service/pyproject.toml
      - ./services/user/poetry.lock:/usr/src/service/poetry.lock
    ports:
      - 9001:8000
    depends_on:
      - redis
      - db
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - redis_network
      - dbnetwork

  notification_service:
    build:
      context: ./services/notification
      dockerfile: Dockerfile
    command: uvicorn app.asgi:application --host 0.0.0.0 --port 8000 --reload --log-level info
    volumes:
      - ./app:/usr/src/service/app
      - ./core:/usr/src/service/core
      - ./services/notification/apis:/usr/src/service/apis
      - ./services/notification/.env:/usr/src/service/.env
      - static_volume:/usr/src/service/static
      - media_volume:/usr/src/service/media
      - ./services/notification/pyproject.toml:/usr/src/service/pyproject.toml
      - ./services/notification/poetry.lock:/usr/src/service/poetry.lock
    ports:
      - 9012:8000
    depends_on:
      - db
      - redis
    networks:
      - redis_network
      - dbnetwork

  resource_service:
    build:
      context: ./services/resource
      dockerfile: Dockerfile
    command: uvicorn app.asgi:application --host 0.0.0.0 --port 8000 --reload --log-level info
    volumes:
      - ./app:/usr/src/service/app
      - ./core:/usr/src/service/core
      - ./services/resource/apis:/usr/src/service/apis
      - ./services/resource/.env:/usr/src/service/.env
      - static_volume:/usr/src/service/static
      - media_volume:/usr/src/service/media
      - ./services/resource/pyproject.toml:/usr/src/service/pyproject.toml
      - ./services/resource/poetry.lock:/usr/src/service/poetry.lock
    ports:
      - 9014:8000
    depends_on:
      - db
      - redis
    networks:
      - redis_network
      - dbnetwork

  booking_service:
    build:
      context: ./services/booking
      dockerfile: Dockerfile
    command: uvicorn app.asgi:application --host 0.0.0.0 --port 8000 --reload --log-level info
    volumes:
      - ./app:/usr/src/service/app
      - ./core:/usr/src/service/core
      - ./services/booking/apis:/usr/src/service/apis
      - ./services/booking/.env:/usr/src/service/.env
      - static_volume:/usr/src/service/static
      - media_volume:/usr/src/service/media
      - ./services/booking/pyproject.toml:/usr/src/service/pyproject.toml
      - ./services/booking/poetry.lock:/usr/src/service/poetry.lock
    ports:
      - 9015:8000
    depends_on:
      - db
      - redis
    networks:
      - redis_network
      - dbnetwork

  storage_service:
    build:
      context: ./services/storage
      dockerfile: Dockerfile
    command: uvicorn app.asgi:application --host 0.0.0.0 --port 8000 --reload --log-level info
    volumes:
      - ./app:/usr/src/service/app
      - ./core:/usr/src/service/core
      - ./services/storage/apis:/usr/src/service/apis
      - ./services/storage/.env:/usr/src/service/.env
      - static_volume:/usr/src/service/static
      - ./services/storage/pyproject.toml:/usr/src/service/pyproject.toml
      - ./services/storage/poetry.lock:/usr/src/service/poetry.lock
    ports:
      - 9016:8000
    depends_on:
      - db
      - redis
    networks:
      - redis_network
      - dbnetwork

  master_data_service:
    build:
      context: ./services/master-data
      dockerfile: Dockerfile
    command: uvicorn app.asgi:application --host 0.0.0.0 --port 8000 --reload --log-level info
    volumes:
      - ./app:/usr/src/service/app
      - ./core:/usr/src/service/core
      - ./services/master-data/apis:/usr/src/service/apis
      - ./services/master-data/.env:/usr/src/service/.env
      - static_volume:/usr/src/service/static
      - media_volume:/usr/src/service/media
      - ./services/master-data/pyproject.toml:/usr/src/service/pyproject.toml
      - ./services/master-data/poetry.lock:/usr/src/service/poetry.lock
    ports:
      - 9017:8000
    depends_on:
      - db
      - redis
    networks:
      - redis_network
      - dbnetwork

  apschedule:
    build:
      context: ./services/apschedule
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./services/apschedule/app:/usr/src/service/app
      - ./core:/usr/src/service/core
      - ./services/apschedule/pyproject.toml:/usr/src/service/pyproject.toml
      - ./services/apschedule/poetry.lock:/usr/src/service/poetry.lock
      - ./services/apschedule/.env:/usr/src/service/.env
    ports:
      - 9013:8000

    depends_on:
      - redis
      - db
    networks:
      - redis_network
      - dbnetwork

  redis:
    image: "redis:latest"
    ports:
      - 6379:6379
    networks:
      - redis_network

  celery:
    build:
      context: ./services/celery
      dockerfile: Dockerfile
    command: celery -A app.celery worker --loglevel=info
    volumes:
      - ./services/celery/app:/usr/src/service/app
      - ./services/celery/.env:/usr/src/service/.env
      - ./core:/usr/src/service/core
    depends_on:
      - redis
    networks:
      - redis_network
      - dbnetwork

  nodejs:
    build:
      context: ./services/nodejs-socket
      dockerfile: Dockerfile
    command: yarn dev
    volumes:
      - ./services/nodejs-socket:/usr/src/service
      - node_modules_volume:/usr/src/service/node_modules
    ports:
      - 9000:9000
      - 50051:50051
    depends_on:
      - redis
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - redis_network
      - dbnetwork

  nginx:
    build: ./nginx
    volumes:
      - static_volume:/home/app/web/static
      - media_volume:/home/app/web/media
    ports:
      - "${FORWARD_PORT}:80"
    depends_on:
      - user_service
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - nginx_network

  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - 5434:5432
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - TZ=Asia/Ho_Chi_Minh
    networks:
      - dbnetwork

volumes:
  postgres_data:
  static_volume:
  media_volume:
  node_modules_volume:

networks:
  redis_network:
    driver: bridge
  nginx_network:
    driver: bridge
  dbnetwork:
    driver: bridge
