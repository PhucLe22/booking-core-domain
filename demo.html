    /* ---------- 4. Calendar  (GET /calendars/) ----------
       start_date + end_date required (max 31 days); optional resource_type, resource;
       every resource is listed, a booking shows on every day it covers; cancelled hidden */
    const CAL_MAX_DAYS = 31;
    function calendarError(f) {
      if (!f.start) return "Please enter start date!";
      if (!f.end) return "Please enter end date!";
      const span = daysBetween(f.start, f.end) + 1;
      if (span < 1) return "End date must be on or after start date!";
      if (span > CAL_MAX_DAYS) return `Calendar range cannot exceed ${CAL_MAX_DAYS} days!`;
      return "";
    }
    // the part of a booking that falls on one day, eg "20:00 →", "all day", "→ 09:00"
    function dayPart(b, d) {
      const startsToday = b.start_at.startsWith(d), endsToday = b.end_at.startsWith(d) || b.end_at === `${addDays(d, 1)}T00:00`;
      if (startsToday && endsToday) return `${b.start_at.slice(11)}–${b.end_at.startsWith(d) ? b.end_at.slice(11) : "24:00"}`;
      if (startsToday) return `${b.start_at.slice(11)} →`;
      if (endsToday) return `→ ${b.end_at.slice(11)}`;
      return "all day";
    }
    async function loadCalendar(f, key) {
      const q = new URLSearchParams({ start_date: f.start, end_date: f.end });
      if (f.typeId) q.set("resource_type", f.typeId);
      if (f.resId) q.set("resource", f.resId);
      const r = await api("GET", `/calendars/?${q}`);
      if (ui.cal.key !== key) return;
      ui.cal.loading = false;
      ui.cal.error = r.ok ? "" : r.message;
      ui.cal.data = r.ok ? r.data.map((res) => ({ ...res, calendar: res.calendar.map((d) => ({ ...d, bookings: d.bookings.map((b) => normBooking(b, res.id)) })) })) : [];
      if (ui.view === "calendar") render();
    }
    VIEWS.calendar = {
      level: "CALENDAR.VIEW", api: ["GET /calendars/?start_date=&end_date=&resource_type=&resource= (max 31 days, cancelled hidden)"],

        const error = calendarError(f);

        const key = JSON.stringify(f);
        if (!error && ui.cal.key !== key) { ui.cal = { key, loading: true }; loadCalendar(f, key); }

        </div>

      html() {

            const rules = ruleSummary(r || {});
            return `<span class="chip plain" title="${esc(n)}">${esc(r?.label || humanize(n))} <span class="muted">· ${esc(FIELD_TYPE_LABEL[builderType(r || {})] || r?.type)}${rules ? `, ${esc(rules)}` : ""}</span>${r?.required ? ' <b class="req" title="Required">*</b>' : ""}</span>`;

    // rule inputs that fit a field type (names = rule keys of the API)
    function ruleInputs(type, f = {}) {
      const box = (label, html, cls = "") => `<label class="rule ${cls}"><span>${label}</span>${html}</label>`;
      const inp = (key, t = "text", ph = "") => `<input data-rule="${key}" type="${t}" ${t === "number" ? 'step="any"' : ""} value="${esc(f[key] ?? "")}" placeholder="${esc(ph)}">`;
      const limit = TIME_TYPES.includes(type) ? HTML_INPUT[type] : "number";
      const out = [];
      if (NUMBER_TYPES.includes(type) || TIME_TYPES.includes(type)) out.push(box("Min", inp("min", limit)), box("Max", inp("max", limit)));
      if (TEXT_TYPES.includes(type)) out.push(box("Min length", inp("min_length", "number")), box("Max length", inp("max_length", "number")));
      if (type === "array") out.push(
        box("Item type", `<select data-rule="item_type"><option value="">Anything</option>${ITEM_TYPES.map((t) => `<option value="${t}" ${f.item_type === t ? "selected" : ""}>${esc(FIELD_TYPE_LABEL[t])}</option>`).join("")}</select>`),
        box("Min items", inp("min_items", "number")), box("Max items", inp("max_items", "number")),
        `<label class="rule check"><input type="checkbox" data-rule="unique" ${f.unique ? "checked" : ""}> no duplicates</label>`);
      const lists = `<option value="">— choose a list —</option>${db.enums.map((e) => `<option value="${esc(e.code)}" ${f.enum_type === e.code ? "selected" : ""}>${esc(e.name)} (${esc(e.code)})</option>`).join("")}`;
      if (type === "enum") out.unshift(box('Master data list <b class="req">*</b>', `<select data-rule="enum_type">${lists}</select>`, "wide"));
      if (type === "array") out.push(box("Or a master data list", `<select data-rule="enum_type">${lists}</select>`));
      if (type !== "object") out.push(box("Default", `<input data-rule="default" value="${esc(defaultText(f))}" placeholder="${type === "array" ? "a, b" : type === "boolean" ? "true / false" : ""}">`));
      return `<div class="rule-grid">${out.join("")}</div>`;
    }

    // status dropdown of the resource form: the values of the type's status list
    function statusSelect(t, current) {
      const list = statusListOf(t), defs = enumDefs(list);
      return `<span>Status <i>from ${esc(enumType(list)?.name || list)}</i></span><select id="rStatus"><option value="" ${current ? "" : "selected"}>— No status —</option>${defs.map((s) => `<option value="${s.code}" ${s.code === current ? "selected" : ""}>${esc(s.name)}${s.code === "ACTIVE" || s.configuration?.bookable ? " · bookable" : ""}</option>`).join("")}</select><em class="ferr" data-err="status"></em>`;
    }

    // when a type moves to another status list, each status its resources use now needs a status of the new list
    function statusMapInputs(typeCode, list) {
      const defs = enumDefs(list);
      const used = [...new Set(db.resources.filter((r) => r.type === typeCode && r.status).map((r) => r.status))].filter((code) => !defs.some((s) => s.code === code));
      if (!typeCode || !used.length) return "";
      const oldList = resStatusList(db.resources.find((r) => r.type === typeCode));
      return `<span>Move resources to the new statuses <i>every resource of this type gets the status picked here</i></span>
        ${used.map((code) => `<div class="frow" style="grid-template-columns:1fr auto 1fr;align-items:center"><span>${esc(enumDef(oldList, code)?.name || code)} <i class="muted">(${db.resources.filter((r) => r.type === typeCode && r.status === code).length})</i></span><span class="muted">becomes</span>
          <select class="smap" data-old="${esc(code)}"><option value="">— No status —</option>${defs.map((s) => `<option value="${s.code}">${esc(s.name)}</option>`).join("")}</select></div>`).join("")}
        <em class="ferr" data-err="status_mapping"></em>`;
    }
    const readStatusMap = () => Object.fromEntries($$("#tStatusMap .smap").map((el) => [el.dataset.old, el.value]));

    function fieldRow(name = "", field = { type: "string" }) {
      // label, help, choices and pattern are not edited here anymore; ones saved before are kept while the type stays the same
      const keep = Object.fromEntries(["label", "help", "choices", "pattern"].filter((k) => field[k] !== undefined).map((k) => [k, field[k]]));
      return `<div class="frow-wrap" data-type="${esc(builderType(field))}" data-keep="${esc(JSON.stringify(keep))}"><div class="frow"><input class="fname" placeholder="e.g. capacity" value="${esc(name)}">
    <select class="ftype" data-chg="ftype">${BUILDER_TYPES.map((x) => `<option value="${x}" ${x === builderType(field) ? "selected" : ""}>${esc(FIELD_TYPE_LABEL[x])} — ${esc(FIELD_TYPE_HINT[x])}</option>`).join("")}</select>
    <label class="sm muted" style="display:flex;gap:4px;align-items:center"><input type="checkbox" class="freq" ${field.required ? "checked" : ""}> required</label>
    <button class="ghost danger sm" data-act="rmField">✕</button></div>
    <div class="frules">${ruleInputs(builderType(field), field)}</div></div>`;
    }

    function readSchema() {
      const fields = {}, errors = [];
      $$("#schemaRows .frow-wrap").forEach((row) => {
        const n = $(".fname", row).value.trim();
        if (!n) return;
        if (!/^[a-z][a-z0-9_]*$/.test(n)) errors.push(`Field '${n}' can only use lowercase letters, numbers and _ (e.g. max_people)!`);
        if (fields[n]) errors.push(`Field '${n}' is duplicated!`);
        const picked = $(".ftype", row).value, type = picked === "enum" ? "string" : picked, f = { type };
        if ($(".freq", row).checked) f.required = true;
        $$("[data-rule]", row).forEach((inp) => {
          const key = inp.dataset.rule, raw = inp.type === "checkbox" ? inp.checked : inp.value.trim();
          if (raw === "" || raw === false) return;
          try {
            if (["min", "max"].includes(key)) f[key] = NUMBER_TYPES.includes(type) ? Number(raw) : raw;
            else if (["min_length", "max_length", "min_items", "max_items"].includes(key)) f[key] = parseInt(raw, 10);
            else if (key === "unique") f[key] = true;
            else if (key === "choices") f[key] = raw.split(",").map((x) => x.trim()).filter(Boolean).map((x) => parseScalar(x, type === "array" ? f.item_type : type));
            else if (key === "default") f[key] = parseValue(raw, type, f.item_type);
            else f[key] = raw;
          } catch { errors.push(`'${n}.${key}' is not valid JSON!`); }
        });
        if (picked === row.dataset.type) Object.assign(f, JSON.parse(row.dataset.keep || "{}"));
        if (picked === "enum" && !f.enum_type) errors.push(`Please choose a master data list for '${n}'!`);
        if (f.default !== undefined) { const msg = checkFieldValue(n, f.default, f); if (msg) errors.push(`Default of '${n}' is not valid: ${msg}`); }
        fields[n] = f;
      });
      return { fields, errors };
    }

    /* ---------- 7. Resources (admin) ---------- */
    VIEWS.resources = {
      level: "RESOURCE.MANAGE", api: ["GET /resources/", "POST /resources/", "PUT /resources/{id}/", "DELETE /resources/{id}/", "POST /files/ (purpose=RESOURCE_PHOTO)"],
      html() {
        const f = ui.f.res || (ui.f.res = { name: "", type: "", status: "" });
        const list = db.resources.filter((r) => (!f.name || r.name.toLowerCase().includes(f.name.toLowerCase())) && (!f.type || r.type === f.type) && (!f.status || r.status === f.status));
        return `
      <div class="row-between"><div><h1>Resources</h1><p class="lead">The actual things people book. Their extra fields come from the resource type.</p></div><button data-act="resModal">+ New resource</button></div>
      <div class="toolbar">
        <input placeholder="Name" value="${esc(f.name)}" data-chg="resF" data-k="name" style="width:160px">
        <select data-chg="resF" data-k="type"><option value="">All types</option>${db.types.map((t) => `<option value="${esc(t.code)}" ${f.type === t.code ? "selected" : ""}>${esc(t.name)}</option>`).join("")}</select>
        <select data-chg="resF" data-k="status"><option value="">All statuses</option>${[...new Map([...new Set(db.types.map(statusListOf))].flatMap((l) => enumDefs(l)).map((d) => [d.code, d])).values()].map((d) => `<option value="${d.code}" ${f.status === d.code ? "selected" : ""}>${esc(d.name)}</option>`).join("")}</select>
      </div>
      ${resourceGroups(list, f)}`;
      },
    };

    // one value of a resource field, formatted by the type set in the resource type
    function fieldValue(v, type) {
      if (v === undefined || v === null || v === "") return `<span class="muted">—</span>`;
      if (type === "boolean") return v ? `<span class="c-green">✓ Yes</span>` : `<span class="muted">✗ No</span>`;
      if (type === "array" && Array.isArray(v)) return `<div class="chips">${v.map((x) => `<span class="chip plain">${esc(x)}</span>`).join("")}</div>`;
      if (typeof v === "object") return `<div class="kv-view">${Object.entries(v).map(([k, x]) => `<div><span class="muted">${esc(humanize(k))}</span> ${esc(itemText(x))}</div>`).join("") || '<span class="muted">—</span>'}</div>`;
      if (type === "number" && v >= 1000) return esc(Number(v).toLocaleString("vi-VN"));
      return esc(v);
    }

    // one table per resource type, every field of the type is a column
    function resourceGroups(list, f) {
      const types = db.types.filter((t) => !f.type || t.code === f.type);
      if (!types.length) return empty("No resource types yet. Create one first.");
      return types.map((t) => {
        const fields = Object.entries(t.configuration.fields || {});
        const rows = list.filter((r) => r.type === t.code);
        return `<div class="panel table-wrap" style="padding:0;margin-bottom:16px">
          <div class="row-between" style="padding:12px 14px;border-bottom:1px solid var(--border)">
            <div><h3>${esc(t.name)} <span class="muted sm">${esc(t.code)} · ${rows.length} resources · ${fields.length} fields</span></h3></div>
            <div style="display:flex;gap:6px"><button class="ghost sm" data-act="typeModal" data-id="${t.id}">Edit fields</button><button class="sm" data-act="resModal" data-type="${esc(t.code)}">+ Add ${esc(t.name.toLowerCase())}</button></div>
          </div>
          <table>
            <thead><tr><th>Photo</th><th>Resource</th>${fields.map(([n, r]) => `<th>${esc(humanize(n))}${r?.required ? ' <b class="req">*</b>' : ""}<br><span class="muted" style="font-weight:400">${esc(r?.type)}</span></th>`).join("")}<th>Status</th><th>Bookings</th><th></th></tr></thead>
            <tbody>${rows.map((r) => {
              const ph = photoOf(r);
              return `<tr>
                <td>${ph ? `<img class="thumb" src="${ph}">` : `<span class="muted">—</span>`}</td>
                <td><b>${esc(r.name)}</b><br><span class="muted sm">${esc(r.code)}</span></td>
                ${fields.map(([n, rule]) => `<td>${fieldValue(r.configuration[n], rule?.type)}${rule?.required && (r.configuration[n] === undefined || r.configuration[n] === "") ? ' <span class="badge c-red" title="Required field is missing">missing</span>' : ""}</td>`).join("")}
                <td>${resBadge(r)}</td>
                <td>${db.bookings.filter((b) => same(b.resourceId, r.id)).length}</td>
                <td><div class="acts"><button class="ghost sm" data-act="resModal" data-id="${r.id}">Edit</button><button class="ghost danger sm" data-act="deleteRes" data-id="${r.id}">Delete</button></div></td>
              </tr>`;
            }).join("") || `<tr><td colspan="${fields.length + 5}">${empty(`No ${esc(t.name.toLowerCase())} yet.`)}</td></tr>`}</tbody>
          </table>
        </div>`;
      }).join("");
    }

    /* ---------- 8. Master data (admin) ---------- */
    VIEWS.master = {
      level: "MASTER_DATA.MANAGE", api: ["GET /enum_types/", "GET /enum_definitions/ (grouped by type)", "POST/PUT/DELETE /enum_types/ · /enum_definitions/"],
      html() {
        return `
      <div class="row-between page-head">
        <div><h1>Master data</h1><p class="lead">Status lists and other dropdowns live here, not in code.</p></div>
        <button data-act="enumTypeModal">${svgIcon("plus")} New list</button>
      </div>
      <div class="enum-grid">${db.enums.map((e) => {
        const defs = [...e.definitions].sort((a, b) => a.position - b.position);
        return `
        <section class="enum-card ${ui.enumOpen?.has(e.code) ? "open" : ""}">
          <header class="enum-head" data-act="toggleEnum" data-code="${esc(e.code)}" title="Show or hide values">
            <span class="enum-caret"></span>
            <div class="enum-title">
              <div class="enum-name">${esc(e.name)} ${e.is_system ? `<span class="lock-tag">${svgIcon("lock")} System</span>` : ""}</div>
              <code class="enum-code">${esc(e.code)}</code>
            </div>
            <span class="enum-count">${defs.length} value${defs.length === 1 ? "" : "s"}</span>
            <div class="icon-acts">
              <button class="icon-act" title="Edit list" data-act="enumTypeModal" data-id="${e.id}">${svgIcon("edit")}</button>
              <button class="icon-act danger" title="${e.is_system ? "System list: cannot be deleted" : "Delete list"}" data-act="deleteEnumType" data-id="${e.id}">${svgIcon("trash")}</button>
            </div>
          </header>
          <div class="enum-body">
          <table class="enum-table">
            <thead><tr><th>Code</th><th>Name</th><th style="width:60px">Value</th><th style="width:76px"></th></tr></thead>
            <tbody>${defs.map((d) => `<tr class="${d.is_active ? "" : "inactive"}">
              <td><span class="badge c-${d.configuration.color || "gray"}">${esc(d.code)}</span></td>
              <td>${esc(d.name)} ${d.configuration?.bookable ? `<span class="chip" title="Resources with this status can be booked">bookable</span>` : ""} ${d.is_system ? `<span class="lock-mini" title="System value: code is fixed">${svgIcon("lock")}</span>` : ""}</td>
              <td class="num">${d.value}</td>
              <td><div class="icon-acts">
                <button class="icon-act" title="Edit value" data-act="enumDefModal" data-type="${esc(e.code)}" data-id="${d.id}">${svgIcon("edit")}</button>
                ${d.is_system ? "" : `<button class="icon-act danger" title="Delete value" data-act="deleteEnumDef" data-id="${d.id}">${svgIcon("trash")}</button>`}
              </div></td>
            </tr>`).join("") || `<tr><td colspan="4" class="empty">No values yet.</td></tr>`}</tbody>
          </table>
          <button class="add-row" data-act="enumDefModal" data-type="${esc(e.code)}">${svgIcon("plus")} Add value</button>
          </div>
        </section>`;
      }).join("") || empty("No master data yet.")}</div>`;
      },
    };

    /* ---------- 9. Storage & files (admin) ---------- */
    const storagePath = (s) => s?.configuration?.path || (s ? s.code.toLowerCase() : "?");
    VIEWS.storage = {
      level: "STORAGE.MANAGE", api: ["GET/POST/PUT/DELETE /storage_configs/", "GET/POST /files/ (multipart)", "GET /files/{id}/download/", "GET/DELETE /attachments/", "GET /media/{path}/{key}"],
      html() {
        const tab = ui.f.stTab || "files";
        const tabs = `<div class="tabs">${[["files", "Files"], ["attachments", "Attachments"], ["configs", "Storage configs"]].map(([k, l]) => `<a class="${tab === k ? "on" : ""}" data-act="stTab" data-tab="${k}">${l}</a>`).join("")}</div>`;
        const purposes = [...new Set(db.storages.flatMap((s) => s.configuration?.purposes || []).concat(["BOOKING_DOCUMENT", "RESOURCE_PHOTO", "AVATAR"]))];
        let body = "";
        if (tab === "configs") body = `
      <div class="row-between" style="margin-bottom:10px"><p class="muted" style="margin:0">Each LOCAL storage is a folder in the storage service: <code>/usr/src/service/media/&lt;path&gt;</code>. The <b>purpose</b> decides where an upload goes.</p><button data-act="storageModal">+ New storage</button></div>
      <div class="panel table-wrap" style="padding:0"><table>
        <thead><tr><th>Storage</th><th>Provider</th><th>Folder</th><th>Max size</th><th>Allowed files</th><th>Purposes</th><th>Files</th><th></th></tr></thead>
        <tbody>${db.storages.map((s) => `<tr>
          <td><b>${esc(s.code)}</b> ${s.is_default ? '<span class="chip">default</span>' : ""} ${s.is_active === false ? '<span class="badge c-red">inactive</span>' : ""}<br><span class="muted sm">${esc(s.name)}</span></td>
          <td>${esc(s.provider)}</td><td><code>media/${esc(storagePath(s))}</code></td><td>${fmtSize(s.max_file_size_bytes)}</td>
          <td class="sm">${esc((s.allowed_extensions || []).join(", ") || "any")}</td>
          <td class="chips">${(s.configuration?.purposes || []).map((x) => `<span class="chip">${esc(x)}</span>`).join("") || '<span class="muted sm">—</span>'}</td>
          <td>${db.files.filter((f) => f.storage === s.code).length}</td>
          <td><div class="acts"><button class="ghost sm" data-act="storageModal" data-id="${s.id}">Edit</button><button class="ghost danger sm" data-act="deleteStorage" data-id="${s.id}">Delete</button></div></td>
        </tr>`).join("") || `<tr><td colspan="8">${empty("No storage configs.")}</td></tr>`}</tbody></table></div>`;
        if (tab === "files") body = `
      <div class="panel">
        <h3>Upload a file</h3>
        <p class="muted sm" style="margin:4px 0 10px">Storage is picked automatically: chosen storage → storage whose purposes include the purpose → default. Add an object to upload and attach in one step.</p>
        <div class="form-grid" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr))">
          <label class="fld"><span>File *</span><input type="file" id="upFile"><em class="ferr" data-err="file"></em></label>
          <label class="fld"><span>Purpose</span><input id="upPurpose" list="purposeList" placeholder="RESOURCE_PHOTO"><datalist id="purposeList">${purposes.map((x) => `<option value="${esc(x)}">`).join("")}</datalist><em class="ferr" data-err="purpose"></em></label>
          <label class="fld"><span>Storage</span><select id="upStorage"><option value="">Auto</option>${db.storages.map((s) => `<option value="${esc(s.code)}">${esc(s.code)}</option>`).join("")}</select><em class="ferr" data-err="storage_config"></em></label>
          <label class="fld"><span>Attach to</span><select id="upType" data-chg="upType"><option value="">Nothing</option>${ATTACHABLE.filter((a) => a !== "comment").map((a) => `<option value="${a}">${a}</option>`).join("")}</select><em class="ferr" data-err="object_type"></em></label>
          <label class="fld"><span>Object</span><select id="upObj" disabled><option value="">—</option></select><em class="ferr" data-err="object_id"></em></label>
        </div>
        <button style="margin-top:10px" data-act="uploadFile">Upload</button>
      </div>
      <div class="panel table-wrap" style="padding:0"><table>
        <thead><tr><th></th><th>File</th><th>Storage</th><th>Uploaded by</th><th>Attached to</th><th></th></tr></thead>
        <tbody>${db.files.map((f) => {
          const atts = db.attachments.filter((a) => same(a.fileId, f.id)); return `<tr>
          <td>${f.url && f.isImage ? `<a href="${f.url}" target="_blank"><img class="thumb" src="${f.url}"></a>` : `<span class="thumb">📄</span>`}</td>
          <td><b>${esc(f.original_name)}</b><br><span class="muted sm">${esc(f.mime_type)} · ${fmtSize(f.size)}</span></td>
          <td class="sm">${esc(f.storage)}${f.url ? `<br><a class="link" href="${f.url}" target="_blank">open link</a>` : ""}</td>
          <td>${esc(fullName(userById(f.uploaded_by)))}</td>
          <td class="sm">${atts.map((a) => `${a.object_type}: ${esc(objectLabel(a.object_type, a.object_id))}${a.purpose ? ` <span class="chip">${esc(a.purpose)}</span>` : ""}`).join("<br>") || '<span class="muted">—</span>'}</td>
          <td><div class="acts"><button class="ghost sm" data-act="downloadFile" data-id="${f.id}">Download</button><button class="ghost danger sm" data-act="deleteFile" data-id="${f.id}">Delete</button></div></td>
        </tr>`;
        }).join("") || `<tr><td colspan="6">${empty("No files yet. Upload one above, or add a resource photo / avatar.")}</td></tr>`}</tbody></table></div>`;
        if (tab === "attachments") body = `
      <p class="muted">A file can be linked to any object (<code>${ATTACHABLE.join(", ")}</code>) with a purpose. Detaching keeps the file.</p>
      <div class="panel table-wrap" style="padding:0"><table>
        <thead><tr><th>File</th><th>Object</th><th>Purpose</th><th>Created</th><th></th></tr></thead>
        <tbody>${db.attachments.map((a) => {
          const f = fileById(a.fileId); return `<tr>
          <td>${f?.url && f.isImage ? `<img class="thumb" src="${f.url}" style="vertical-align:middle;margin-right:6px">` : "📄 "}${esc(f?.original_name || a.file_detail?.original_name || a.fileId)}</td>
          <td>${esc(a.object_type)}<br><span class="muted sm">${esc(objectLabel(a.object_type, a.object_id))}</span></td>
          <td>${a.purpose ? `<span class="chip">${esc(a.purpose)}</span>` : "—"}</td>
          <td class="sm">${fmtDT(s16(a.created_at))}</td>
          <td><div class="acts"><button class="ghost danger sm" data-act="detach" data-id="${a.id}">Detach</button></div></td>
        </tr>`;
        }).join("") || `<tr><td colspan="5">${empty("No attachments yet.")}</td></tr>`}</tbody></table></div>`;
        return `<h1>Storage & files</h1><p class="lead">Where uploaded files are stored and what they belong to.</p>${tabs}${body}`;
      },
    };

    /* ---------- 10. Users (admin) ---------- */
    VIEWS.users = {
      level: "USER.MANAGE", api: ["GET /users/", "POST /users/", "PUT /users/{id}/", "DELETE /users/{id}/ (soft delete)"],
      html() {
        const f = ui.f.users || (ui.f.users = { q: "", role: "", status: "" });
        const list = db.users.filter((u) => (!f.q || `${u.username} ${fullName(u)}`.toLowerCase().includes(f.q.toLowerCase())) && (!f.role || u.roles.includes(f.role)) && (!f.status || String(u.status !== false) === f.status));
        const roleCodes = [...new Set([...db.roles.map((r) => r.code), ...db.users.flatMap((u) => u.roles)])];
        return `
      <div class="row-between"><div><h1>Users</h1><p class="lead">Admin creates staff accounts here. Customers create their own account by signing up.</p></div><button data-act="userModal">+ New staff account</button></div>
      <div class="toolbar">
        <input placeholder="Search name or username" value="${esc(f.q)}" data-chg="userF" data-k="q" style="width:200px">
        <select data-chg="userF" data-k="role"><option value="">All roles</option>${roleCodes.map((c) => `<option value="${esc(c)}" ${f.role === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>
        <select data-chg="userF" data-k="status"><option value="">All statuses</option><option value="true" ${f.status === "true" ? "selected" : ""}>Active</option><option value="false" ${f.status === "false" ? "selected" : ""}>Inactive</option></select>
      </div>
      <div class="panel table-wrap" style="padding:0"><table>
        <thead><tr><th></th><th>Name</th><th>Username</th><th>Roles</th><th>Status</th><th>Bookings</th><th></th></tr></thead>
        <tbody>${list.map((u) => `<tr>
          <td>${avatarHtml(u)}</td><td><b>${esc(fullName(u))}</b>${same(u.id, meUser.id) ? ' <span class="chip">you</span>' : ""}</td><td>@${esc(u.username)}</td>

    /* ---------- 11. Roles & permissions (admin) ---------- */
    VIEWS.roles = {
      level: "ROLE.MANAGE", api: ["GET/POST/PUT/DELETE /roles/", "GET/POST/PUT/DELETE /permissions/"],
      html() {
        return `
      <h1>Roles & permissions</h1><p class="lead">Add roles like CASHIER or RECEPTIONIST and pick what they can do.</p>
      <div class="note">The API checks access by role code (ADMIN, STAFF, CUSTOMER). Permissions saved here are stored with each role for finer checks later.</div>
      <div class="two">
        <div>
          <div class="row-between" style="margin-bottom:8px"><h3>Roles</h3><button class="sm" data-act="roleModal">+ New role</button></div>
          ${db.roles.map((r) => `<div class="panel">
            <div class="row-between"><div><h3>${esc(r.name)} <span class="muted sm">${esc(r.code)}</span> ${r.is_system ? '<span class="chip">system</span>' : ""}</h3><div class="muted sm">${esc(r.description || "")} · ${db.users.filter((u) => u.roles.includes(r.code)).length} users</div></div>
              <div style="display:flex;gap:4px"><button class="ghost sm" data-act="roleModal" data-id="${r.id}">Edit</button>${r.is_system ? "" : `<button class="ghost danger sm" data-act="deleteRole" data-id="${r.id}">✕</button>`}</div></div>
            <div class="chips" style="margin-top:8px">${(r.permissions || []).map((p) => `<span class="chip plain">${esc(p)}</span>`).join("") || '<span class="muted sm">No permissions</span>'}</div>
          </div>`).join("") || empty("No roles.")}
        </div>
        <div>
          <div class="row-between" style="margin-bottom:8px"><h3>Permissions</h3><button class="sm" data-act="permModal">+ New permission</button></div>
          <div class="panel table-wrap" style="padding:0"><table><tbody>${db.permissions.map((p) => `<tr>
            <td><b>${esc(p.code)}</b><br><span class="muted sm">${esc(p.name)}</span></td>
            <td class="sm muted">${db.roles.filter((r) => (r.permissions || []).includes(p.code)).map((r) => esc(r.code)).join(", ")}</td>
            <td><div class="acts"><button class="ghost sm" data-act="permModal" data-id="${p.id}">Edit</button><button class="ghost danger sm" data-act="deletePerm" data-id="${p.id}">✕</button></div></td>
          </tr>`).join("") || `<tr><td>${empty("No permissions yet.")}</td></tr>`}</tbody></table></div>
        </div>
      </div>`;
      },
    };

    /* ---------- 12. Profile ---------- */
    VIEWS.profile = {
      level: "all", api: ["GET /auth/me/", "PUT /auth/me/", "POST /auth/change_password/", "POST /files/ (purpose=AVATAR, object_type=user)", "POST /auth/logout/"],
      html() {
        const u = me();
        return `
      <h1>Profile</h1><p class="lead">Your account.</p>
      <div class="two">
        <div class="panel">
          <div style="display:flex;gap:14px;align-items:center">${avatarHtml(u, true)}
            <div><h3>${esc(fullName(u))}</h3><div class="muted">@${esc(u.username)}</div><div class="chips" style="margin-top:4px">${u.roles.map((r) => `<span class="chip">${esc(r)}</span>`).join("")}</div></div></div>
          <label class="f">Change avatar <span class="muted">(stored by purpose AVATAR)</span></label>
          <div style="display:flex;gap:6px"><input type="file" id="avFile" accept="image/*"><button class="ghost sm" data-act="uploadAvatar">Upload</button></div>
          <div class="sub-h">Edit profile</div>
          <div class="form-grid">
            <label class="fld"><span>First name *</span><input id="pFirst" value="${esc(u.first_name)}"><em class="ferr" data-err="first_name"></em></label>
            <label class="fld"><span>Last name *</span><input id="pLast" value="${esc(u.last_name)}"><em class="ferr" data-err="last_name"></em></label>
          </div>
          <button class="ghost" style="margin-top:10px" data-act="saveProfile">Save</button>
        </div>
        <div>
          <div class="panel">
            <h3>Change password</h3>
            <label class="f">Current password</label><input type="password" id="pwOld" autocomplete="current-password"><em class="ferr" data-err="old_password"></em>
            <label class="f">New password</label><input type="password" id="pwNew" autocomplete="new-password"><em class="ferr" data-err="new_password"></em>
            <label class="f">Confirm new password</label><input type="password" id="pwConfirm" autocomplete="new-password"><em class="ferr" data-err="confirm_password"></em>
            <p class="muted sm">Other sessions are signed out after the change.</p>
            <button class="ghost" data-act="changePassword">Change password</button>
          </div>
          <div class="panel"><h3>What I can do</h3><div class="chips" style="margin-top:8px">${[...myPermissions()].map((p) => `<span class="chip plain">${esc(p)}</span>`).join("") || '<span class="muted sm">Nothing yet: ask an admin for a role.</span>'}</div></div>
        </div>
      </div>`;
      },
    };

    /* =====================================================================
       ACTIONS (click) – each one calls the API, then reloads what changed
       ===================================================================== */
    // the fields a booking PUT needs (EditBookingSerializer), from a cached booking
    const bookingBody = (b, extra = {}) => ({ resource: b.resourceId, start_at: b.start_at, end_at: b.end_at, status: b.status, title: b.title || "", description: b.description || "", ...extra });
    async function afterBookingChange() {
      await reload("bookings", "today");
      ui.cal.key = null; // the calendar loads again
      if (ui.book) ui.book.dayKey = null;
    }

    const ACT = {
      go: (d) => go(d.view),
      closeModal,
      authMode: (d) => { ui.auth = d.mode; render(); },
      async reloadAll(d, el) { await busy(el, loadAll); toast("Data reloaded from the API"); },
      setFor(d, el) {
        $(`#${d.for}`).value = d.v;
        el.parentElement.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === el));
        CHG[d.for]({ value: d.v });
      },
      // user search picker
      pickUser(d) {
        const u = userById(d.id), id = d.picker;
        $(`#${id}`).value = u.id;
        $(`#${id}List`).innerHTML = "";
        $(`#${id}Search`).classList.add("hide");
        const box = $(`#${id}Picked`);
        box.innerHTML = `${avatarHtml(u)}<span style="flex:1"><b>${esc(fullName(u))}</b> <span class="muted">@${esc(u.username)}</span></span><button class="ghost sm" data-act="unpickUser" data-picker="${id}">Change</button>`;
        box.classList.remove("hide");
      },
      unpickUser(d) {
        const id = d.picker;
        $(`#${id}`).value = "";
        $(`#${id}Picked`).classList.add("hide");
        const input = $(`#${id}Search`); input.value = ""; input.classList.remove("hide"); input.focus();
      },

      /* ----- auth ----- */
      // POST /auth/login/
      async login(d, el) {
        const username = val("lUser"), password = $("#lPass").value;
        if (!username || !password) return showErrors({ username: "Please enter username and password!" });
        const r = await busy(el, () => api("POST", "/auth/login/", { username, password }, { auth: false }));
        if (!report(r)) return;
        saveTokens(r.data.access_token, r.data.refresh_token);
        ui.view = "browse"; ui.f = {}; ui.gType = "";
        await loadAll();
      },
      // POST /auth/register/ (role CUSTOMER), then log in
      async register(d, el) {
        const e = {}, username = val("rUser"), password = $("#rPass").value;
        if (!val("rFirst")) e.first_name = "Please enter your firstname!";
        if (!val("rLast")) e.last_name = "Please enter your lastname!";
        if (!username) e.username = "Please enter username!";
        if (!STRONG_PW(password)) e.password = PW_MSG;
        if (!showErrors(e)) return;
        const r = await busy(el, () => api("POST", "/auth/register/", { username, password, first_name: val("rFirst"), last_name: val("rLast") }, { auth: false }));
        if (!report(r)) return;
        const login = await api("POST", "/auth/login/", { username, password }, { auth: false });
        if (!report(login)) return;
        saveTokens(login.data.access_token, login.data.refresh_token);
        ui.auth = "login"; ui.view = "browse";
        await loadAll();
      },
      // POST /auth/logout/
      async logout() {
        if (refreshToken) await api("POST", "/auth/logout/", { refresh_token: refreshToken });
        saveTokens(null, null); meUser = null; closeModal();
        Object.keys(db).forEach((k) => (db[k] = Array.isArray(db[k]) ? [] : {}));
        ui.cal = {}; ui.book = null;
        toast("Logout successfully!"); render();
      },

      /* ----- book a resource ----- */
      browseType: (d) => { setGlobalType(d.type === "ALL" ? "" : d.type); render(); },
      openBook: (d) => go("book", { book: { rid: d.id, day: TODAY, a: null, b: null } }),
      bookDay: (d) => { ui.book.day = d.day; ui.book.a = ui.book.b = null; $$("[data-act=bookDay]").forEach((p) => p.classList.toggle("on", p.dataset.day === d.day)); loadDay(); },
      slot(d) {
        const b = ui.book, i = +d.i;
        if (b._bad[i]) return;
        if (b.a == null || b.b != null || i <= b.a) { b.a = i; b.b = null; }
        else if (b._bad.slice(b.a, i + 1).some(Boolean)) { b.a = i; b.b = null; } // a booked slot is in between
        else b.b = i;
        refreshSlots();
      },
      // POST /bookings/ (myself) or /bookings/staff/ (a user or a guest)
      async createBooking(d, el) {
        const b = ui.book, p = P(), r = resById(b.rid), slots = slotList();
        if (b.a == null) return toast("Please choose a time!", false);
        const body = { resource: r.id, start_at: `${b.day}T${m2t(slots[b.a])}`, end_at: `${b.day}T${m2t(slots[b.b ?? b.a] + p.slot)}`, status: val("bkStatus") || "CONFIRMED", title: val("bkTitle"), description: val("bkDesc") };
        const forV = val("bkFor") || "me";
        let path = "/bookings/";
        if (forV === "customer") {
          if (!val("bkUser")) return toast("Please select a customer or enter guest name!", false);
          path = "/bookings/staff/"; body.user = Number(val("bkUser"));
        } else if (forV === "guest") {
          path = "/bookings/staff/"; Object.assign(body, { guest_name: val("gName"), guest_email: val("gEmail"), guest_phone: val("gPhone") });
        }
        const res = await busy(el, () => api("POST", path, body));
        if (!report(res)) return;
        const bk = normBooking(res.data);
        b.a = b.b = null;
        await afterBookingChange();
        render();
        openModal(`<h2>🎉 Booking created</h2>
      <dl class="kv"><dt>Resource</dt><dd>${esc(r.name)}</dd><dt>Start at</dt><dd>${fmtDT(bk.start_at)}</dd><dt>End at</dt><dd>${fmtDT(bk.end_at)}</dd><dt>For</dt><dd>${esc(bookedFor(bk))}</dd><dt>Status</dt><dd>${badge("BOOKING_STATUS", bk.status)}</dd></dl>
      <div class="foot"><span class="spacer"></span><button class="ghost" data-act="closeModal">Book another</button><button data-act="afterBook" data-mine="${same(bk.userId, meUser.id)}">${same(bk.userId, meUser.id) ? "My bookings" : "All bookings"}</button></div>`);
      },
      afterBook: (d) => { closeModal(); go(d.mine === "true" && can("BOOKING.VIEW_OWN") ? "mine" : "bookings"); },

      /* ----- booking actions ----- */
      mineTab: (d) => { ui.f.mine = d.tab; render(); },
      openBooking: (d) => openBooking(d.id),
      // PUT /bookings/{id}/ with a new status
      async transition(d, el) {
        const b = bkById(d.id) || ui.cal.data?.flatMap((x) => x.calendar.flatMap((c) => c.bookings)).find((x) => same(x.id, d.id));
        if (!b) return toast("No Booking matches the given query!", false);
        const err = statusChangeError(b.status, d.to); if (err) return toast(err, false);
        if (d.to === "CANCELLED" && !confirm(`Cancel "${b.title || "this booking"}"?`)) return;
        const full = bkById(b.id) || b; // calendar rows have no description
        const r = await busy(el, () => api("PUT", `/bookings/${b.id}/`, bookingBody(full, { status: d.to })));
        if (!report(r)) return;
        closeModal(); await afterBookingChange(); render();
      },
      // PUT /bookings/{id}/ with a new time (customer)
      async moveBooking(d, el) {
        const b = bkById(d.id), s = `${val("mvDay")}T${val("mvFrom")}`, e = `${val("mvDay")}T${val("mvTo")}`;
        if (e <= s) return toast("End time must be after start time!", false);
        const r = await busy(el, () => api("PUT", `/bookings/${b.id}/`, bookingBody(b, { start_at: s, end_at: e })));
        if (!report(r)) return;
        closeModal(); await afterBookingChange(); render();
      },
      async deleteBooking(d, el) {
        if (!confirm("Delete this booking for good?")) return;
        const r = await busy(el, () => api("DELETE", `/bookings/${d.id}/`));
        if (!report(r)) return;
        closeModal(); await afterBookingChange(); render();
      },
      async attachToBooking(d, el) {
        const r = await busy(el, () => uploadFile($("#atFile").files[0], { purpose: "BOOKING_DOCUMENT", objectType: "booking", objectId: d.id }));
        if (!report(r)) return;
        render(); openBooking(d.id);
      },

      /* ----- staff / admin booking form
         create: POST /bookings/staff/ (user OR guest_name + guest_email)
         edit:   PUT  /bookings/{id}/  (resource, start_at, end_at, status, title, description) ----- */
      bookingForm(d) {
        const p = P(), b = d.id ? bkById(d.id) : null;
        if (b && !(TRANSITIONS[b.status] || []).length) return toast(statusChangeError(b.status, b.status), false);
        const pickable = [...db.resources].sort((x, y) => x.name.localeCompare(y.name));
        if (!pickable.length) return toast("No resource created yet!", false);
        const local = (x) => `${dayKey(x)}T${pad(x.getHours())}:${pad(x.getMinutes())}`;
        const next = new Date(); next.setMinutes(0, 0, 0); next.setHours(next.getHours() + 1);
        const startV = b ? b.start_at : local(next);
        const endV = b ? b.end_at : local(new Date(next.getTime() + p.slot * 60000));
        const statuses = b ? [b.status, ...TRANSITIONS[b.status]] : ["CONFIRMED", "PENDING"];
        const u = b && userById(b.userId);
        openModal(`<h2>${b ? "Edit" : "New"} booking</h2>
          <div class="sub-h">User or guest</div>
          ${b ? `<p style="margin:0">${b.userId ? `${esc(bookedFor(b))} ${u ? `<span class="muted">@${esc(u.username)}</span>` : ""}` : `${esc(b.guest_name)} <span class="chip">guest</span> <span class="muted sm">${esc(b.guest_email)} ${esc(b.guest_phone)}</span>`}</p>
                 <p class="muted sm" style="margin:2px 0 0">Who a booking is for can't be changed. Cancel it and create a new one instead.</p>` : `
          ${bookForSwitch("nbFor", ["customer", "guest"])}
          <div class="form-grid" style="margin-top:10px">
            <div class="fld full" id="nbCustomerBox"><span>User *</span>${userPicker("nbUser")}<p class="hint">${USER_HINT}</p><em class="ferr" data-err="user"></em></div>
            <p class="hint fld full hide nbGuest" style="margin:0">${GUEST_HINT}</p>
            <label class="fld full hide nbGuest"><span>Guest name *</span><input id="nbGName" maxlength="255"><em class="ferr" data-err="guest_name"></em></label>
            <label class="fld hide nbGuest"><span>Guest email *</span><input id="nbGEmail" type="email" maxlength="255"><em class="ferr" data-err="guest_email"></em></label>
            <label class="fld hide nbGuest"><span>Guest phone</span><input id="nbGPhone" maxlength="20"><em class="ferr" data-err="guest_phone"></em></label>
          </div>`}
          <div class="sub-h">Resource & time</div>
          <div class="form-grid">
            <label class="fld full"><span>Resource *</span><select id="nbRes" data-chg="nbRes">${b ? "" : `<option value="">— Choose a resource —</option>`}${db.types.map((t) => {
              const rs = pickable.filter((r) => r.type === t.code);
              return rs.length ? `<optgroup label="${esc(t.name)}">${rs.map((r) => `<option value="${r.id}" ${same(r.id, b?.resourceId) ? "selected" : ""}>${esc(r.name)} · ${esc(r.code)}${isBookable(r) ? "" : ` — ${esc(resStatusName(r))}`}</option>`).join("")}</optgroup>` : "";
            }).join("")}</select><em class="ferr" data-err="resource"></em></label>
            <label class="fld"><span>Start at *</span><input type="datetime-local" id="nbStart" value="${startV}" step="${p.slot * 60}" data-chg="nbBusy"><em class="ferr" data-err="start_at"></em></label>
            <label class="fld"><span>End at *</span><input type="datetime-local" id="nbEnd" value="${endV}" step="${p.slot * 60}"><em class="ferr" data-err="end_at"></em></label>
            <div class="fld full"><span>Already booked on the start day</span><div id="nbBusy" class="sm"></div></div>
          </div>
          <div class="sub-h">Details</div>
          <div class="form-grid">
            <label class="fld"><span>Title</span><input id="nbTitle" maxlength="255" value="${esc(b?.title || "")}" placeholder="${esc(p.titles[0])}"><em class="ferr" data-err="title"></em></label>
            <label class="fld ${b ? "" : "hide"}" id="nbStatusBox"><span>Status</span><select id="nbStatus">${statuses.map((c) => `<option value="${c}" ${c === b?.status ? "selected" : ""}>${esc(enumDef("BOOKING_STATUS", c)?.name || c)}</option>`).join("")}</select><em class="ferr" data-err="status"></em></label>
            <label class="fld full"><span>Description</span><textarea id="nbDesc" rows="2">${esc(b?.description || "")}</textarea></label>
          </div>
          <div class="foot"><span class="spacer"></span><button class="ghost" data-act="closeModal">Close</button><button data-act="saveBookingForm" data-id="${b?.id || ""}">${b ? "Save changes" : "Create booking"}</button></div>`);
        CHG.nbBusy();
      },
      async saveBookingForm(d, el) {
        const b = d.id ? bkById(d.id) : null;
        if (!val("nbRes")) return toast("Please select a resource!", false);
        if (!val("nbStart")) return toast("Please enter start time!", false);
        if (!val("nbEnd")) return toast("Please enter end time!", false);
        if (val("nbEnd") <= val("nbStart")) return toast("End time must be after start time!", false);
        const body = { resource: val("nbRes"), start_at: val("nbStart"), end_at: val("nbEnd"), status: val("nbStatus"), title: val("nbTitle"), description: val("nbDesc") };
        if (!b) {
          if (val("nbFor") === "customer") {
            if (!val("nbUser")) return toast("Please select a customer or enter guest name!", false);
            body.user = Number(val("nbUser"));
          } else Object.assign(body, { guest_name: val("nbGName"), guest_email: val("nbGEmail"), guest_phone: val("nbGPhone") });
        } else {
          const sErr = statusChangeError(b.status, body.status); if (sErr) return toast(sErr, false);
        }
        const r = await busy(el, () => (b ? api("PUT", `/bookings/${b.id}/`, body) : api("POST", "/bookings/staff/", body)));
        if (!report(r)) return;
        closeModal(); await afterBookingChange(); render();
      },

      calShift(d) { const f = ui.f.cal, err = calendarError(f); if (err) return toast(err, false); const n = (daysBetween(f.start, f.end) + 1) * +d.n; f.start = addDays(f.start, n); f.end = addDays(f.end, n); render(); },
      calRange(d) { Object.assign(ui.f.cal, { start: TODAY, end: addDays(TODAY, +d.days - 1) }); render(); },
      bkReset() { ui.f.bk = null; render(); },
      bkPage(d) { ui.f.bk.page += +d.n; render(); },

      /* ----- resource types ----- */
      typeModal(d) {
        const t = d.id ? typeById(d.id) : { code: "", name: "", configuration: { fields: {} } };
        const rows = Object.entries(t.configuration.fields || {});
        openModal(`<h2>${d.id ? "Edit" : "New"} resource type</h2>
      <div class="form-grid" style="margin-top:10px">
        <label class="fld"><span>Code *</span><input id="tCode" value="${esc(t.code)}" placeholder="MEETING_ROOM"><em class="ferr" data-err="code"></em></label>
        <label class="fld"><span>Name *</span><input id="tName" value="${esc(t.name)}" placeholder="Meeting room"><em class="ferr" data-err="name"></em></label>
        <label class="fld full"><span>Status list <i>where the statuses of these resources come from</i></span><select id="tStatusList" data-chg="tStatusList" data-type="${esc(t.code)}">${db.enums.map((e) => `<option value="${esc(e.code)}" ${statusListOf(t) === e.code ? "selected" : ""}>${esc(e.name)} (${esc(e.code)})</option>`).join("")}</select>
          <span class="hint" style="margin:0">A status can be booked when its code is ACTIVE or it is marked "bookable" in Master data.</span><em class="ferr" data-err="configuration.status_enum_type"></em></label>
        <div class="fld full" id="tStatusMap"></div>
      </div>
      <div class="sub-h">Fields every resource of this type must have</div>
      <div class="frow sm muted" style="margin-bottom:2px"><span>Field name</span><span>Type</span><span>Required</span><span></span></div>
      <div id="schemaBuilder"><div id="schemaRows">${rows.length ? rows.map(([n, r]) => fieldRow(n, r || { type: "string" })).join("") : fieldRow()}</div>
        <button class="ghost sm" data-act="addField">+ Add field</button></div>
      <em class="ferr" data-err="configuration"></em><em class="ferr" data-err="configuration.fields"></em>
      <div class="foot"><span class="spacer"></span><button class="ghost" data-act="closeModal">Close</button><button data-act="saveType" data-id="${d.id || ""}">Save</button></div>`);
      },
      addField() { $("#schemaRows").insertAdjacentHTML("beforeend", fieldRow()); },
      rmField(d, el) { el.closest(".frow-wrap").remove(); },
      async saveType(d, el) {
        const t = d.id ? typeById(d.id) : null, { fields, errors } = readSchema(), e = {};
        if (!val("tCode")) e.code = "Please enter code!";
        if (!val("tName")) e.name = "Please enter name!";
        if (errors.length) e.configuration = errors[0];
        if (!showErrors(e)) return;
        const body = { code: val("tCode").toUpperCase(), name: val("tName"), configuration: { ...(t?.configuration || {}), status_enum_type: val("tStatusList") || "RESOURCE_STATUS", fields }, status_mapping: readStatusMap() };

      },
    };
    function saveRead() { store.set("readNotifs", JSON.stringify(db.notifications.filter((n) => n.is_read).map((n) => String(n.id)))); }

    /* =====================================================================
       CHANGE handlers
       ===================================================================== */
    const CHG = {
      apiBase(el) { API = el.value.trim().replace(/\/+$/, "") || DEFAULT_API; store.set("apiBase", API); toast(`API set to ${API}`); },
      apiToggle(el) { ui.showApi = el.checked; render(); },
      browseQ(el) { ui.f.browse.q = el.value; render(); },
      bkFor(el) { $("#bkCustomerBox").classList.toggle("hide", el.value !== "customer"); $("#bkGuestBox").classList.toggle("hide", el.value !== "guest"); },
      nbFor(el) { $("#nbCustomerBox").classList.toggle("hide", el.value !== "customer"); $$(".nbGuest").forEach((x) => x.classList.toggle("hide", el.value !== "guest")); },
      // the booking status is chosen only after a resource is picked
      nbRes() { $("#nbStatusBox").classList.toggle("hide", !resById(val("nbRes"))); CHG.nbBusy(); },
      nbBusy() {
        const box = $("#nbBusy"); if (!box) return;
        const rid = val("nbRes"), day = val("nbStart").slice(0, 10);
        if (!rid) { box.innerHTML = `<span class="muted">Choose a resource first</span>`; return; }
        const r = resById(rid);
        if (!isBookable(r)) { box.innerHTML = `<span class="err">${esc(r.name)} is ${esc(resStatusName(r))}, so it can't be booked.</span>`; return; }
        const list = db.bookings.filter((b) => same(b.resourceId, rid) && b.start_at.startsWith(day) && isActiveBk(b)).sort((a, b) => a.start_at.localeCompare(b.start_at));
        box.innerHTML = list.length ? list.map((b) => `<span class="chip plain">${b.start_at.slice(11)}–${b.end_at.slice(11)} · ${esc(bookedFor(b))}</span>`).join(" ") : `<span class="muted">Free all day</span>`;
      },
      calStart(el) { ui.f.cal.start = el.value; render(); },
      calEnd(el) { ui.f.cal.end = el.value; render(); },
      calType(el) { setGlobalType(typeById(el.value)?.code || ""); render(); },
      calRes(el) { ui.f.cal.resId = el.value; render(); },
      bkF(el) { if (el.dataset.k === "type") setGlobalType(el.value); else { ui.f.bk[el.dataset.k] = el.value; ui.f.bk.page = 1; } render(); },
      resF(el) { if (el.dataset.k === "type") setGlobalType(el.value); else ui.f.res[el.dataset.k] = el.value; render(); },
      userF(el) { ui.f.users[el.dataset.k] = el.value; render(); },
      // the rule inputs follow the chosen field type
      ftype(el) { const wrap = el.closest(".frow-wrap"); $(".frules", wrap).innerHTML = ruleInputs(el.value, {}); },
      tStatusList(el) { $("#tStatusMap").innerHTML = statusMapInputs(el.dataset.type, el.value); },
      resType(el) { const t = typeByCode(el.value); $("#cfgBox").innerHTML = configInputs(t?.configuration.fields, {}, "cf"); $("#rStatusBox").innerHTML = statusSelect(t, $("#rStatus")?.value); },
      upType(el) { const sel = $("#upObj"), opts = objectOptions(el.value); sel.disabled = !el.value; sel.innerHTML = el.value ? opts.map(([id, label]) => `<option value="${id}">${esc(label)}</option>`).join("") : `<option value="">—</option>`; },
    };

    document.addEventListener("click", (e) => {
      const t = e.target.closest("[data-act]");
      if (!t || t.disabled) return;
      ACT[t.dataset.act]?.(t.dataset, t, e);
    });
    document.addEventListener("change", (e) => { const t = e.target.closest("[data-chg]"); if (t) CHG[t.dataset.chg]?.(t, e); });
    document.addEventListener("input", (e) => { const id = e.target.dataset?.userSearch; if (id) searchUsers(id, e.target.value); });
    // close open lists when clicking outside them
    document.addEventListener("mousedown", (e) => { if (ui.notifOpen && !e.target.closest(".notif-wrap")) { ui.notifOpen = false; refreshNotif(); } });
    document.addEventListener("mousedown", (e) => { if (!e.target.closest(".picker")) $$(".picker-list").forEach((l) => (l.innerHTML = "")); });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { closeModal(); if (ui.notifOpen) { ui.notifOpen = false; refreshNotif(); } }
      if (e.key === "Enter" && !meUser && ["lUser", "lPass"].includes(e.target.id)) ACT.login({}, null);
    });
    window.addEventListener("error", (e) => { let b = $("#fatal"); if (!b) { b = document.createElement("div"); b.id = "fatal"; document.body.prepend(b); } b.textContent = "UI error: " + e.message; });

    /* ---------- start: reuse the saved login if there is one ---------- */
    (function init() {
      if (token) loadAll(); else render();
    })();
  </script>
</body>

</html>
